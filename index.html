<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물가와 환율, 사례로 이해하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F0; --card:#FFFFFF; --ink:#15222A; --muted:#51616A; --line:#CCD7D1;
  --green:#1A6A55; --green-soft:#D9EEE5; --gold:#E2A21C; --gold-ink:#8A5A00; --gold-soft:#FCEFCF;
  --red:#BE3B33; --red-soft:#F9E0DC; --blue:#2A5A9A; --blue-soft:#DCE6F5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10181D; --card:#18232A; --ink:#E6EEEA; --muted:#9DAEB5; --line:#2C3C44;
    --green:#5FC3A0; --green-soft:#183A31; --gold:#F0B93D; --gold-ink:#F3C969; --gold-soft:#3A2F15;
    --red:#EE7D72; --red-soft:#40211E; --blue:#86AEE8; --blue-soft:#1B2C44;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10181D; --card:#18232A; --ink:#E6EEEA; --muted:#9DAEB5; --line:#2C3C44;
  --green:#5FC3A0; --green-soft:#183A31; --gold:#F0B93D; --gold-ink:#F3C969; --gold-soft:#3A2F15;
  --red:#EE7D72; --red-soft:#40211E; --blue:#86AEE8; --blue-soft:#1B2C44;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.display{font-family:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;letter-spacing:-0.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
img,svg{max-width:100%}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 0 8px;flex-wrap:wrap}
.brand{background:none;border:0;padding:0;font-size:20px;color:var(--ink)}
.parts{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.parts button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:500}
.parts button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}
.steps:empty{display:none}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:5px 12px 5px 6px;font-size:14px;white-space:nowrap}
.pill .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--paper);font-weight:700;font-size:13px}
.pill.done .n{background:var(--green);color:var(--card)}
.pill[aria-current="step"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold)}

/* hero */
.hero{padding:48px 0 32px}
.hero h1{font-size:clamp(34px,6.4vw,60px);line-height:1.15;margin:0 0 16px}
.hero > p{max-width:36em;color:var(--muted);font-size:17px;margin:0 0 32px}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.door{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:22px;min-height:250px;transition:transform .15s}
.door:hover{transform:translateY(-3px)}
.door-t{font-size:26px;line-height:1.2}
.door-d{color:var(--muted);font-size:15px;flex:1}
.door-prog{font-size:13px;font-weight:700;color:var(--green)}
.ptag{position:relative;display:inline-flex;align-items:baseline;gap:10px;background:var(--gold);color:#2A1D00;padding:6px 16px 6px 30px;border-radius:4px 10px 10px 4px;font-weight:700;font-size:18px;clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%)}
.ptag::before{content:"";position:absolute;left:12px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--card)}
.ptag s{font-weight:500;opacity:.65;font-size:15px}
.board{display:inline-flex;align-items:center;gap:10px;background:#0E2A22;color:#7FF0C3;border-radius:8px;padding:6px 12px;font-variant-numeric:tabular-nums;font-weight:700}
.board small{color:#B9D9CC;font-weight:500;font-size:12px}
.board em{color:#FF8A7A;font-style:normal}
.chain-mini{display:flex;gap:4px;flex-wrap:wrap}
.chain-mini span{background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700}

/* step */
main{padding:28px 0 64px}
.step-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.step-no{flex:0 0 auto;display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:28px}
.step-head h2{font-size:clamp(26px,4.2vw,36px);line-height:1.25;margin:2px 0 8px}
.lead{margin:0;color:var(--muted);max-width:42em;font-size:16.5px}
.block{margin:26px 0}
.block > h3{font-size:18px;margin:0 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.note{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.why h3{margin:0 0 4px;font-size:19px}
.why p{margin:0 0 6px}
.why.d{border-top:5px solid var(--red)}
.why.s{border-top:5px solid var(--blue)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.flow span{background:var(--paper);border-radius:8px;padding:3px 10px;font-size:14px;font-weight:500}
.flow i{font-style:normal;color:var(--muted)}
.flow .end{background:var(--ink);color:var(--paper)}
.flow .warn{background:var(--red-soft);color:var(--red)}
.key{margin-top:34px;border-left:6px solid var(--gold);background:var(--gold-soft);border-radius:0 14px 14px 0;padding:16px 20px}
.key b{display:block;font-size:14px;color:var(--gold-ink);margin-bottom:2px}
.key p{margin:0;font-weight:500}

/* sliders */
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 26px;margin-bottom:18px}
.ctrls label{display:flex;flex-direction:column;gap:6px;font-weight:500}
.ctrls label b{font-size:22px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--green);height:28px}

/* basket */
.basket{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.item .nm{font-size:14px;color:var(--muted)}
.item .old{font-size:13px;color:var(--muted);text-decoration:line-through}
.item .new{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.power{margin-top:18px}
.power-bar{height:22px;border-radius:6px;background:var(--paper);overflow:hidden;border:1px solid var(--line)}
.power-bar span{display:block;height:100%;background:var(--green);transition:width .3s}
.power p{margin:8px 0 0;font-weight:500}
table{border-collapse:collapse;width:100%;font-size:15px}
.tbl{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{font-size:14px;color:var(--muted);font-weight:700}
td.up{color:var(--red);font-weight:700}
td.dn{color:var(--green);font-weight:700}

/* cases (price tags) */
.cls-help{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px;color:var(--muted)}
.score{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.case{position:relative;background:var(--card);border:1.5px solid var(--ink);border-radius:6px 16px 16px 6px;padding:16px 16px 16px 36px}
.case::before{content:"";position:absolute;left:13px;top:22px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper)}
.case.ok{border-color:var(--green);background:linear-gradient(var(--green-soft),var(--green-soft)) left/6px 100% no-repeat,var(--card)}
.case-t{margin:0 0 12px;font-weight:500}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.chip,.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500;text-align:left}
.chip:hover:not(:disabled),.opt:hover:not(:disabled){border-color:var(--ink)}
.chip.right,.opt.right{background:var(--green);border-color:var(--green);color:var(--card)}
.chip.wrong,.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.chip:disabled,.opt:disabled{cursor:default}
.fb{margin:10px 0 0;font-size:14.5px}
.fb.good{color:var(--ink)}
.fb.good::before{content:"정답! ";font-weight:700;color:var(--green)}
.fb.bad{color:var(--red)}

/* mcq */
.mcq{border:1.5px solid var(--ink);border-radius:16px;padding:18px;background:var(--card);margin-top:14px}
.mcq .q{margin:0 0 12px;font-weight:700}
.mcq .q::before{content:"확인 문제";display:inline-block;margin-right:8px;background:var(--ink);color:var(--paper);font-size:12px;border-radius:6px;padding:1px 8px;vertical-align:2px}
.opts{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.opt{border-radius:12px}

/* game */
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.meter{border-radius:12px;padding:12px;background:var(--paper)}
.meter small{display:block;color:var(--muted);font-size:13px}
.meter b{font-size:28px;font-variant-numeric:tabular-nums}
.meter em{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.meter.alert b{color:var(--red)}
.meter.good b{color:var(--green)}
.moves{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.moves button{border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.moves button.up{background:var(--red-soft)}
.moves button.dn{background:var(--green-soft)}
.news{border-left:4px solid var(--blue);padding:4px 0 4px 12px;margin:10px 0;font-size:15px}
.news b{color:var(--blue)}
.verdict{border-radius:12px;padding:14px;margin-top:10px;font-weight:500}
.verdict.win{background:var(--green-soft)}
.verdict.lose{background:var(--red-soft)}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px}

/* assets */
.asset h4{margin:0 0 6px;font-size:17px}
.asset p{margin:0 0 6px;font-size:14.5px}
.asset .warn{color:var(--muted)}
.asset .warn::before{content:"주의 ";font-weight:700;color:var(--red)}
.asset .plus::before{content:"물가 오를 때 ";font-weight:700;color:var(--green)}
.rows{display:grid;gap:10px}
.rowc{display:grid;grid-template-columns:110px 1fr 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.rowc:last-child{border-bottom:0;padding-bottom:0}
.rowc small{display:block;color:var(--muted);font-size:12.5px}
.rowc b{font-variant-numeric:tabular-nums;font-size:18px}
.realrate{margin-top:14px;border-radius:12px;padding:12px 14px;font-weight:500}
.realrate.neg{background:var(--red-soft)}
.realrate.pos{background:var(--green-soft)}

/* fx */
.fxgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:center}
.big{font-size:clamp(28px,5vw,42px);line-height:1.15;font-variant-numeric:tabular-nums}
.stat{margin:8px 0;font-size:15.5px}
.stat b{font-variant-numeric:tabular-nums}
.status{border-radius:10px;padding:10px 12px;font-weight:500;margin-top:10px}
.status.up{background:var(--red-soft)}
.status.dn{background:var(--green-soft)}
.status.eq{background:var(--paper)}
#beam{transition:transform .35s ease}
.analogy{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.analogy div{border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center}
.analogy b{display:block;font-size:20px}
.sdwrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.sdbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sdbtns button{border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:9px 8px;font-weight:700;font-size:14px}
.sdbtns .d{background:var(--red-soft)}
.sdbtns .s{background:var(--blue-soft)}
.sdlog{margin-top:12px;font-size:15px;min-height:4.5em}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:2px 0}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ccard{border-radius:14px;padding:14px;border:1.5px solid var(--line);background:var(--card)}
.ccard h4{margin:0 0 4px;font-size:16px}
.ccard .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.ccard .chg{font-size:13.5px;color:var(--muted)}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;margin-top:6px}
.badge.g{background:var(--green-soft);color:var(--green)}
.badge.b{background:var(--red-soft);color:var(--red)}
.badge.n{background:var(--paper);color:var(--muted)}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:2px}
.ev{position:relative;margin-bottom:18px}
.ev::before{content:"";position:absolute;left:-24px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--ink)}
.ev.revealed.up::before{background:var(--red);border-color:var(--red)}
.ev.revealed.dn::before{background:var(--green);border-color:var(--green)}
.ev .yr{font-size:24px;line-height:1.2}
.ev h4{margin:2px 0 6px;font-size:17px}
.ev p{margin:0 0 10px}
.res{border-radius:12px;padding:12px 14px;background:var(--paper);margin-top:10px}
.res .rate{font-weight:700}

/* challenge */
.scn{border:2px solid var(--ink);border-radius:18px;background:var(--card);overflow:hidden}
.scn-top{background:var(--ink);color:var(--paper);padding:14px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.scn-body{padding:20px}
.scn-news{font-size:19px;font-weight:700;margin:0 0 16px;line-height:1.5}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:16px;min-height:30px}
.links span{background:var(--green-soft);color:var(--green);border-radius:8px;padding:3px 10px;font-size:14px;font-weight:700}
.links i{font-style:normal;color:var(--muted)}
.links .todo{background:var(--paper);color:var(--muted);border:1px dashed var(--line)}
.cq{font-weight:700;margin:0 0 10px}
.final{text-align:center;padding:10px}
.final .big{margin:6px 0}

/* profile */
.me{border:1.5px solid var(--ink);background:var(--gold-soft);border-radius:10px;padding:5px 12px;font-size:14px;font-weight:700}
.me.empty{background:var(--red-soft);border-style:dashed}
.pform,.pcard{margin:0 0 26px;max-width:680px}
.pform{border:2px solid var(--ink)}
.pform h3{margin:0 0 4px;font-size:19px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr) 2fr;gap:10px}
.pgrid label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
.pgrid input,.pgrid select{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.perr{color:var(--red);font-weight:500;margin:10px 0 0}
.prow{display:flex;gap:8px;margin-top:14px}
.pcard{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pcard small{display:block;color:var(--muted);font-size:13px}
.pcard b{font-size:20px}
.pstats{display:flex;gap:18px;flex:1;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.pstats strong{display:block;color:var(--ink);font-size:18px}
.who{font-weight:700;margin:0 0 6px}
@media (max-width:680px){.pgrid{grid-template-columns:repeat(3,1fr)}.pgrid .wide{grid-column:1/-1}}

/* pager */
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px;flex-wrap:wrap}
.pager button{border:1.5px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;max-width:100%}
.pager .nx{background:var(--ink);color:var(--paper);margin-left:auto}

@media (max-width:680px){
  .fxgrid,.sdwrap{grid-template-columns:1fr}
  .meters{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .meter b{font-size:22px}
  .rowc{grid-template-columns:80px 1fr 1fr}
  .step-no{width:42px;height:42px;font-size:22px}
  .hero{padding-top:28px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <button class="brand display" data-act="home">물가·환율 사례 학습장</button>
      <nav class="parts" id="parts" aria-label="단원"></nav>
      <button class="me" id="me" data-act="profile"></button>
    </div>
    <nav class="steps" id="steps" aria-label="학습 단계"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>

<script>
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r1 = v => Math.round(v * 10) / 10;

let progress = {};
try { progress = JSON.parse(localStorage.getItem('pxfx-progress') || '{}') || {}; } catch (e) { progress = {}; }
function saveProgress() { try { localStorage.setItem('pxfx-progress', JSON.stringify(progress)); } catch (e) {} }

/* ---------- quiz data ---------- */
const MCQ = {
  p1q: { q: '물가가 오르면 1만 원의 가치는 어떻게 될까요?', o: ['올라간다', '떨어진다', '변하지 않는다'], a: 1,
    e: '1만 원이라는 숫자는 그대로지만, 그 돈으로 살 수 있는 상품의 양이 줄어요. 이것을 ‘화폐 가치(구매력)의 하락’이라고 해요.' },
  p4q: { q: '물가가 너무 빠르게 오를 때 한국은행이 주로 쓰는 방법은?', o: ['기준 금리를 올린다', '기준 금리를 내린다', '돈을 더 찍어 나눠 준다'], a: 0,

/* ---------- student profile ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let profile = null;
try { profile = JSON.parse(localStorage.getItem('pxfx-profile') || 'null'); } catch (e) { profile = null; }
let editingProfile = false;
function saveProfile() { try { localStorage.setItem('pxfx-profile', JSON.stringify(profile)); } catch (e) {} }
function profileLabel() { return profile ? `${profile.g}학년 ${profile.c}반 ${profile.n}번 ${profile.name}` : ''; }
function renderMe() {
  const b = $('#me');
  b.textContent = profile ? profileLabel() : '내 정보 입력';
  b.classList.toggle('empty', !profile);
}
function profileForm() {
  const p = profile || { g: '', c: '', n: '', name: '' };
  return `<div class="panel pform" id="pform">
    <h3>내 정보 입력</h3>
    <p class="note" style="margin:0 0 12px">학습을 시작하기 전에 학년, 반, 번호, 이름을 적어 주세요. 정보는 이 기기에만 저장돼요.</p>
    <div class="pgrid">
      <label>학년<select id="pg"><option value="">선택</option>${[1, 2, 3].map(v => `<option value="${v}" ${String(p.g) === String(v) ? 'selected' : ''}>${v}학년</option>`).join('')}</select></label>
      <label>반<input id="pc" type="number" min="1" max="30" inputmode="numeric" value="${esc(p.c)}"></label>
      <label>번호<input id="pn" type="number" min="1" max="60" inputmode="numeric" value="${esc(p.n)}"></label>
      <label class="wide">이름<input id="pname" type="text" maxlength="20" autocomplete="off" value="${esc(p.name)}"></label>
    </div>
    <p class="perr" id="perr" hidden></p>
    <div class="prow"><button class="btn" data-act="psave">저장하기</button>${profile ? '<button class="btn ghost" data-act="pcancel">취소</button>' : ''}</div>
  </div>`;
}
function meBlock() {
  if (!profile || editingProfile) return profileForm();
  const total = PARTS.reduce((a, p) => a + p.steps.length, 0);
  const done = PARTS.reduce((a, p, i) => a + partDone(i), 0);
  const best = progress.chBest != null ? `${progress.chBest} / ${CH_TOTAL}` : '아직 안 함';
  return `<div class="panel pcard">
    <div><small>학습자</small><b>${esc(profileLabel())}</b></div>
    <div class="pstats"><span>완료한 단계<strong>${done} / ${total}</strong></span><span>챌린지 최고 점수<strong>${best}</strong></span></div>
    <button class="btn ghost" data-act="pedit">정보 수정</button>
  </div>`;
}
function openProfile(msg) {
  cur = { p: -1, s: 0 }; editingProfile = true; renderStep();
  if (msg) { const er = $('#perr'); er.hidden = false; er.textContent = msg; }
  const f = ['#pg', '#pc', '#pn', '#pname'].find(s => !$(s).value) || '#pname';
  $(f).focus();
  $('#pform').scrollIntoView({ block: 'center' });
}
function doSave() {
  const g = $('#pg').value, c = $('#pc').value.trim(), n = $('#pn').value.trim(), name = $('#pname').value.trim();
  if (!g || !c || !n || !name) {
    const er = $('#perr'); er.hidden = false; er.textContent = '학년, 반, 번호, 이름을 모두 입력해 주세요.';
    const f = [['#pg', g], ['#pc', c], ['#pn', n], ['#pname', name]].find(x => !x[1]); if (f) $(f[0]).focus();
    return;
  }
  profile = { g, c, n, name }; saveProfile(); editingProfile = false; renderStep();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest && e.target.closest('#pform') && e.target.tagName !== 'BUTTON') { e.preventDefault(); doSave(); }
});

function partDone(pi) { return PARTS[pi].steps.filter(s => progress[s.id]).length; }

function renderNav() {
  renderMe();

    `<button data-act="part" data-p="${i}" aria-current="${cur.p === i}">${p.short}</button>`).join('');
  if (cur.p < 0) { $('#steps').innerHTML = ''; return; }
  $('#steps').innerHTML = PARTS[cur.p].steps.map((s, i) =>
    `<button class="pill ${progress[s.id] ? 'done' : ''}" data-act="go" data-p="${cur.p}" data-s="${i}" ${cur.s === i ? 'aria-current="step"' : ''}>
      <span class="n">${progress[s.id] ? '✓' : i + 1}</span>${s.t}</button>`).join('');
  const a = $('#steps [aria-current="step"]');
  if (a) a.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function renderStep() {
  if (cur.p < 0) { renderNav(); renderHome(); return; }
  const P = PARTS[cur.p], S = P.steps[cur.s];
  const prev = cur.s > 0 ? P.steps[cur.s - 1] : (cur.p > 0 ? PARTS[cur.p - 1].steps.at(-1) : null);
  const next = cur.s < P.steps.length - 1 ? P.steps[cur.s + 1] : (cur.p < PARTS.length - 1 ? PARTS[cur.p + 1].steps[0] : null);
  $('#main').innerHTML = `
    <section>
      <div class="step-head"><span class="step-no display">${cur.s + 1}</span>
        <div><h2 class="display">${S.h}</h2><p class="lead">${S.lead}</p></div></div>
      ${S.body()}
      <div class="key"><b>핵심 정리</b><p>${S.key}</p></div>
      <nav class="pager">
        ${prev ? `<button data-act="prev">이전: ${prev.t}</button>` : ''}
        ${next ? `<button class="nx" data-act="next">다음: ${next.t}</button>` : `<button class="nx" data-act="home">처음 화면으로</button>`}
      </nav>
    </section>`;
  renderNav();
  if (S.mount) S.mount();
  window.scrollTo({ top: 0 });
}

function go(p, s) { cur = { p, s }; renderStep(); }
function stepId() { return cur.p < 0 ? null : PARTS[cur.p].steps[cur.s].id; }
function checkStep() {
  const req = $$('#main .req');
  if (req.length && req.every(el => el.classList.contains('solved'))) {
    const id = stepId();
    if (id && !progress[id]) { progress[id] = true; saveProgress(); renderNav(); }
  }
}

function rgChart() {
  const W = 300, H = 120, px = i => 24 + i * ((W - 34) / RG.max), py = v => H - 14 - clamp(v, 0, 8) * ((H - 24) / 8);
  const line = (k, c) => `<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${RG.hist.map((h, i) => px(i) + ',' + py(h[k])).join(' ')}"/>` +
    RG.hist.map((h, i) => `<circle cx="${px(i)}" cy="${py(h[k])}" r="3" fill="${c}"/>`).join('');
  return `<svg style="display:block;width:100%;max-width:520px" viewBox="0 0 ${W} ${H}" role="img" aria-label="라운드별 기준 금리와 물가 상승률">

    ${[0, 2, 4, 6, 8].map(v => `<text x="2" y="${py(v) + 4}" font-size="10" fill="var(--muted)">${v}%</text><line x1="24" x2="${W - 10}" y1="${py(v)}" y2="${py(v)}" stroke="var(--line)" stroke-width="1"/>`).join('')}
    ${line('rate', 'var(--blue)')}${line('infl', 'var(--red)')}${line('unemp', 'var(--gold)')}
  </svg>`;
}
function rgDraw() {
  const el = $('#rg'); if (!el) return;
  const fin = RG.round >= RG.max;
  const ic = RG.infl > 2.8 ? 'alert' : RG.infl >= 1.5 ? 'good' : 'alert';
  const uc = RG.unemp > 4.5 ? 'alert' : 'good';
  const moves = [[-1, '1%p 인하', 'dn'], [-0.5, '0.5%p 인하', 'dn'], [0, '동결', ''], [0.5, '0.5%p 인상', 'up'], [1, '1%p 인상', 'up'], [1.5, '1.5%p 인상', 'up']];
  let verdict = '';
  if (fin) {
    const win = RG.infl >= 1.5 && RG.infl <= 2.8 && RG.unemp <= 4.5;
    let msg;
    if (win) msg = '성공! 물가를 목표 근처로 낮추면서 일자리도 지켰어요. 물가가 잡히기 시작하면 금리를 다시 조금 낮추는 것이 요령이에요.';
    else if (RG.infl > 2.8) msg = '아직 물가가 높아요. 금리를 너무 늦게, 혹은 너무 조금 올렸어요. 돈을 빌리기 쉬운 상태가 계속되면 수요가 줄지 않아요.';
    else if (RG.unemp > 4.5) msg = '물가는 잡혔지만 금리를 너무 세게 올려 경기가 얼어붙었어요. 실업이 늘었어요.';
    else msg = '물가가 목표보다 너무 낮아졌어요. 경기가 식고 있다는 신호예요. 물가가 잡히기 시작할 때 금리를 낮췄어야 해요.';
    verdict = `<div class="verdict ${win ? 'win' : 'lose'}">${msg}</div>
      <p style="margin:12px 0 0"><button class="btn ghost" data-act="rgreset">다시 해 보기</button></p>`;
  }
  el.innerHTML = `
    <p style="margin:0 0 10px;font-weight:700">${fin ? '결과' : `${RG.round + 1}번째 결정 (${RG.max}번 중)`}</p>
    <div class="meters">
      <div class="meter"><small>기준 금리</small><b>${RG.rate.toFixed(1)}%</b><em>내가 정하는 값</em></div>
      <div class="meter ${ic}"><small>물가 상승률</small><b>${RG.infl.toFixed(1)}%</b><em>목표 2% 근처</em></div>
      <div class="meter ${uc}"><small>실업률</small><b>${RG.unemp.toFixed(1)}%</b><em>4.5% 이하 유지</em></div>
    </div>
    ${RG.news.length ? `<div class="news"><b>뉴스</b> ${RG.news.at(-1)}</div>` : '<div class="news"><b>뉴스</b> 장바구니 물가가 들썩이고 있어요. 금리가 낮아 대출을 받아 소비하는 사람도 많아요.</div>'}
    ${fin ? '' : `<div class="moves">${moves.map(([d, l, c]) => `<button class="${c}" data-act="rg" data-d="${d}">${l}</button>`).join('')}</div>`}
    ${rgChart()}
    <div class="legend"><span><i style="background:var(--blue)"></i>기준 금리</span><span><i style="background:var(--red)"></i>물가 상승률</span><span><i style="background:var(--gold)"></i>실업률</span><span><i style="background:var(--green-soft);height:10px"></i>물가 목표 범위</span></div>
    ${verdict}`;
  if (fin) { el.classList.add('solved'); checkStep(); }
}
function rgMove(d) {
  if (RG.round >= RG.max) return;
  const oldI = RG.infl, oldU = RG.unemp;
  RG.rate = clamp(RG.rate + d, 0, 8);
  RG.infl = r1(clamp(RG.infl - 0.8 * (RG.rate - 2.0), -1, 12));
  RG.unemp = r1(clamp(RG.unemp + 0.4 * (RG.rate - 2.5), 2.5, 10));
  let n;
  if (RG.infl > oldI + 0.2) n = '물가 상승세가 더 거세졌어요. 금리가 낮아 돈을 빌리기 쉬우니 소비가 계속 늘고 있어요.';
  else if (RG.infl < 1.0) n = '물가가 너무 낮아졌어요. 사람들이 지갑을 닫고 가게 매출이 줄고 있어요.';
  else if (RG.infl < oldI - 0.2) n = '대출 이자가 올라 소비와 기업 투자가 줄었어요. 물가 상승세가 꺾이고 있어요.';
  else n = '물가 흐름에 큰 변화가 없어요.';
  if (RG.unemp > 4.5) n += ' 공장 가동이 줄고 채용이 얼어붙어 실업자가 늘고 있어요!';
  else if (RG.unemp > oldU + 0.15) n += ' 기업들이 채용을 조금씩 줄이고 있어요.';
  RG.news.push(n);
  RG.hist.push({ rate: RG.rate, infl: RG.infl, unemp: RG.unemp });
  RG.round++;
  rgDraw();
}

    const pct = Math.round(CH.score / CH_TOTAL * 100);
    if (progress.chBest == null || CH.score > progress.chBest) { progress.chBest = CH.score; saveProgress(); }
    const msg = pct >= 85 ? '물가와 환율의 연결 고리를 아주 잘 이해하고 있어요!' : pct >= 60 ? '대부분 잘 연결했어요. 틀린 고리가 있던 단계를 다시 보면 완벽해져요.' : '헷갈리는 고리가 있었어요. 2부 1~3단계를 복습하고 다시 도전해 보세요.';
    el.innerHTML = `<div class="scn"><div class="scn-top"><span>챌린지 결과</span><span>${CHALLENGE.length}개 사례 완료</span></div>
      <div class="scn-body final">${profile ? `<p class="who">${esc(profileLabel())}</p>` : ''}<p class="note" style="margin:0 0 8px">${new Date().toLocaleDateString('ko-KR')}</p><p style="margin:0">처음 시도에 맞힌 고리</p><div class="big display">${CH.score} / ${CH_TOTAL}</div><p>${msg}</p>
      <button class="btn" data-act="chreset">처음부터 다시</button></div></div>`;
    el.classList.add('solved'); checkStep();
    return;
  }
  const sc = CHALLENGE[CH.si], q = sc.qs[CH.qi];
  const links = sc.qs.map((x, i) => i < CH.chain.length ? `<span>${CH.chain[i]}</span>` : `<span class="todo">?</span>`).join('<i>→</i>');
  el.innerHTML = `<div class="scn">
    <div class="scn-top"><span>사례 ${CH.si + 1} / ${CHALLENGE.length}</span><span>처음 시도 정답 ${CH.score}</span></div>
    <div class="scn-body">
      <p class="scn-news">${sc.t}</p>
      <div class="links" aria-label="생각의 사슬">${links}</div>
      ${CH.fb ? `<p class="fb ${CH.fbOk ? 'good' : 'bad'}" style="margin:0 0 14px">${CH.fb}</p>` : ''}
      ${q ? `<p class="cq">${CH.qi + 1}. ${q.q}</p>
        <div class="opts">${q.o.map((o, i) => `<button class="opt" data-act="ch" data-i="${i}">${o}</button>`).join('')}</div>`
      : `<button class="btn" data-act="chnext">${CH.si < CHALLENGE.length - 1 ? '다음 사례' : '결과 보기'}</button>`}
    </div></div>`;
}
function chAnswer(i) {
  const q = CHALLENGE[CH.si].qs[CH.qi];
  if (i === q.a) {
    if (CH.first) CH.score++;
    CH.chain.push(q.s); CH.fb = q.e; CH.fbOk = true; CH.qi++; CH.first = true;
  } else {
    CH.first = false; CH.fbOk = false; CH.fb = `‘${q.o[i]}’은(는) 아니에요. 다시 생각해 보세요.`;
  }
  chDraw();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'home') { cur = { p: -1, s: 0 }; renderStep(); window.scrollTo({ top: 0 }); return; }
  if (act === 'profile' || act === 'pedit') { openProfile(); return; }
  if (act === 'psave') { doSave(); return; }
  if (act === 'pcancel') { editingProfile = false; renderStep(); return; }
  if (act === 'part') { if (!profile) { openProfile('학습을 시작하려면 먼저 내 정보를 입력해 주세요.'); return; } const p = +t.dataset.p; const st = PARTS[p].steps.findIndex(s => !progress[s.id]); go(p, st < 0 ? 0 : st); return; }
  if (act === 'go') { go(+t.dataset.p, +t.dataset.s); return; }
  if (act === 'next') { const P = PARTS[cur.p]; if (cur.s < P.steps.length - 1) go(cur.p, cur.s + 1); else go(cur.p + 1, 0); return; }
  if (act === 'prev') { if (cur.s > 0) go(cur.p, cur.s - 1); else go(cur.p - 1, PARTS[cur.p - 1].steps.length - 1); return; }
  if (act === 'rg') { rgMove(+t.dataset.d); return; }
  if (act === 'rgreset') { rgReset(); $('#rg').classList.remove('solved'); rgDraw(); return; }
  if (act === 'sd') { const k = t.dataset.k, v = +t.dataset.v; SD[k] = clamp(SD[k] + v, -36, 36); SD.msg = SDMSG[k + v]; sdDraw(); return; }
  if (act === 'sdreset') { mountX2(); return; }
  if (act === 'tl') { tlAnswer(t.closest('.ev'), t.dataset.g); return; }
  if (act === 'ch') { chAnswer(+t.dataset.i); return; }
  if (act === 'chnext') { CH.si++; CH.qi = 0; CH.chain = []; CH.fb = ''; CH.first = true; if (CH.si >= CHALLENGE.length) CH.done = true; chDraw(); return; }
  if (act === 'chreset') { $('#ch').classList.remove('solved'); chReset(); chDraw(); return; }

  // multiple choice
  const mq = t.closest('.mcq');
  if (mq && t.classList.contains('opt')) {
    const m = MCQ[mq.dataset.q], i = +t.dataset.i, fb = $('.fb', mq);
    fb.hidden = false;
    if (i === m.a) {
      t.classList.add('right'); $$('.opt', mq).forEach(b => b.disabled = true);
      fb.className = 'fb good'; fb.textContent = m.e; mq.classList.add('solved'); checkStep();
    } else {
      t.classList.add('wrong'); t.disabled = true;
      fb.className = 'fb bad'; fb.textContent = '아쉬워요. 다른 답을 골라 보세요.';
    }
    return;
  }
  // classification
  const cs = t.closest('.case');
  if (cs && t.classList.contains('chip')) {
    const box = t.closest('.cls'), set = SETS[box.dataset.set], it = set.items[+cs.dataset.i], fb = $('.fb', cs);
    fb.hidden = false;
    if (t.dataset.c === it.a) {
      t.classList.add('right'); $$('.chip', cs).forEach(b => b.disabled = true); cs.classList.add('ok');
      fb.className = 'fb good'; fb.textContent = it.e;
      const n = $$('.case.ok', box).length;
      $('.score', box).textContent = `${n} / ${set.items.length}`;
      if (n === set.items.length) { box.classList.add('solved'); checkStep(); }
    } else {
      t.classList.add('wrong'); t.disabled = true;
      fb.className = 'fb bad'; fb.textContent = '다시 생각해 볼까요? 다른 쪽을 골라 보세요.';
    }
  }
});

renderStep();
</script>
</body>
</html>
